<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d3b30" />
  <title>Estate Management | Account recovery</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #17231e; --forest: #0d3b30; --muted: #617169; --line: #e3ebe6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 30px 20px; background: radial-gradient(circle at 10% 10%, #155a47 0, transparent 38%), var(--forest); }
    .card { width: min(440px, 100%); background: white; border-radius: 20px; padding: 32px; box-shadow: 0 24px 60px #03130f66; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 24px; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: #e8f2ec; color: var(--forest); }
    .brand-mark svg { width: 19px; height: 19px; }
    h1 { margin: 0 0 8px; font-size: 23px; letter-spacing: -0.5px; }
    p { margin: 0 0 22px; color: var(--muted); font-size: 12.5px; line-height: 1.65; }
    label { display: block; margin: 0 0 6px; font-size: 12px; font-weight: 700; }
    input { width: 100%; padding: 12px 13px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 11px; font: inherit; font-size: 14px; background: #fbfdfb; }
    input:focus { outline: 2px solid #9ec9ae; border-color: #258565; background: white; }
    button { width: 100%; padding: 13px; border: 0; border-radius: 11px; background: var(--forest); color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    .error { margin-top: 12px; color: #a32c2c; font-size: 12px; min-height: 18px; }
    .success { margin-top: 12px; color: #176b4b; font-size: 12px; min-height: 18px; }
    .foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid #eef2ef; font-size: 11px; color: var(--muted); line-height: 1.6; }
    a { color: var(--forest); font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/></svg></span>
      Estate Management
    </div>
    <h1>Reset your password</h1>
    <p>Enter the one-time code issued by your estate or platform administrator, then choose a new password. Codes expire after 30 minutes and can only be used once.</p>
    <form id="form">
      <label for="email">Email address</label>
      <input id="email" type="email" required autocomplete="username" placeholder="you@example.test" />
      <label for="code">Recovery code</label>
      <input id="code" type="text" required minlength="6" maxlength="20" placeholder="8-character code" style="text-transform:uppercase;letter-spacing:2px" />
      <label for="password">New password</label>
      <input id="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password" placeholder="At least 12 characters" />
      <button type="submit">Reset password</button>
    </form>
    <div class="error" id="error" role="alert"></div>
    <div class="success" id="success" role="status"></div>
    <div class="foot"><a href="/login/">Back to sign in</a></div>
  </main>
  <script>
    const isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);
    const API = isLocal ? `${window.location.protocol}//${window.location.hostname}:4100/api/v1` : `${window.location.origin}/api/v1`;
    document.getElementById('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.getElementById('error');
      const success = document.getElementById('success');
      error.textContent = '';
      success.textContent = '';
      try {
        const response = await fetch(API + '/auth/confirm-recovery', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim().toLowerCase(),
            code: document.getElementById('code').value.trim().toUpperCase(),
            newPassword: document.getElementById('password').value,
          }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.message || 'The code could not be used.');
        success.textContent = 'Password updated. You can now sign in with your new password.';
      } catch (err) {
        error.textContent = err instanceof Error ? err.message : 'Could not reset the password.';
      }
    });
  </script>
</body>
</html>
