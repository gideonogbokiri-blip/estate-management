services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estate_management}
      POSTGRES_USER: ${POSTGRES_USER:-estate_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before starting}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-estate_app} -d ${POSTGRES_DB:-estate_management}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER:-estate_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-estate_management}?schema=public
      APP_ORIGINS: ${APP_ORIGINS:?set APP_ORIGINS to the exact public web origin}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET to at least 32 random bytes}
      DOCUMENT_STORAGE_PATH: /app/.private-documents
      GATE_MANUAL_ADMISSION_ENABLED: ${GATE_MANUAL_ADMISSION_ENABLED:-true}
    ports:
      - "4100:4100"
    volumes:
      - privatedocs:/app/.private-documents

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8765:80"
    volumes:
      - ./client/build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  privatedocs:
