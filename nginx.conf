server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        try_files /index.html =404;
    }

    # Flutter web entry points. Each built bundle lives in its own directory.
    location ~ ^/(admin|web|onboarding|platform|security|properties|landlord-live|landlord|map|join-estate|resident-review|tenant-rent)/ {
        try_files $uri $uri/ /$1/index.html =404;
    }

    location /api/ {
        proxy_pass http://api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:js|wasm|json|woff2?|otf|png|jpg|jpeg|svg|webp|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
